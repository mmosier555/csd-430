<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Feedback</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=radio] + label,
        input[type=checkbox] + label { display: inline; font-weight: normal; margin-right: 12px; }
        input[type=text], input[type=email], input[type=date], select, textarea {
            width: 100%; padding: 8px; box-sizing: border-box;
        }
        button { margin-top: 16px; }
    </style>
</head>
<body>
    <h1>Restaurant Feedback</h1>

    <form action="feedback-result.jsp" method="post">
       
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required>
    
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>   

        <label for="visitDate">Date of Visit *</label>
        <input type="date" id="visitDate" name="visitDate" required>

        <label for="mealType">Meal Type *</label>
        <select id="mealType" name="mealType" required>
            <option value="">-- Select --</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
        </select>

        <label>Visit Type *</label>
        <input type="radio" id="dineIn" name="visitType" value="Dine-in" required>
        <label for="dineIn">Dine-in</label>
        <input type="radio" id="takeOut" name="visitType" value="Take-out">
        <label for="takeOut">Take-out</label>

        <label>What did you enjoy?</label>
        <input type="checkbox" id="food" name="liked" value="Food Quality">
        <label for="food">Food Quality</label>
        <input type="checkbox" id="service" name="liked" value="Service">
        <label for="service">Service</label>

        <label for="rating">Overall Rating *</label>
        <select id="rating" name="rating" required>
            <option value="">-- Select --</option>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Good</option>
            <option value="3">3 - Average</option>
            <option value="2">2 - Poor</option>
            <option value="1">1 - Terrible</option>
        </select>

        <label for="comments">Additional Comments</label>
        <textarea id="comments" name="comments" rows="5"></textarea>

        <button type="submit">Submit Feedback</button>
        <input type="reset" value="Clear Form">   

    </form>
</body>
</html>
